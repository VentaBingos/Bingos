<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultá tu cartón · Bingos 2027</title>
<meta name="theme-color" content="#14532d">
<link rel="icon" href="icono-v2.svg">
<style>
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:#f1f5f0;color:#0f172a}
  header{background:#14532d;color:#fff;text-align:center;padding:26px 16px}header h1{margin:0;font-size:1.5rem}
  main{max-width:520px;margin:auto;padding:16px}
  .box{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px #0001;margin-bottom:14px}
  label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
  input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  .btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;background:#16a34a;color:#fff;margin-top:14px;cursor:pointer;text-decoration:none}
  .wa{background:#25d366}.mut{color:#64748b;font-size:.88rem}
  .tag{display:inline-block;font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:99px}
  .ATRASADO{background:#fee2e2;color:#b91c1c}.A_VENCER{background:#fef3c7;color:#92400e}.AL_DIA{background:#e0f2fe;color:#075985}.CANCELADO{background:#dcfce7;color:#166534}
  table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:10px}td{padding:7px 4px;border-bottom:1px solid #eee}
  tr.P{background:#f0fdf4}tr.V{background:#fef2f2}
  .err{color:#b91c1c;font-weight:600}
</style>
</head>
<body>
<header><h1>Consultá tu cartón</h1><div class="mut" style="color:#d1fae5">Mirá tus cuotas pagas y próximos vencimientos</div></header>
<main>
  <div class="box">
    <label>Bingo</label><select id="bingo"></select>
    <label>DNI</label><input id="dni" inputmode="numeric">
    <label>Últimos 4 números de tu teléfono</label><input id="tel4" inputmode="numeric" maxlength="4">
    <button class="btn" id="go">Consultar</button>
    <p class="err" id="err"></p>
  </div>
  <div id="res"></div>
  <p style="text-align:center"><a href="index.html" style="color:#15803d;font-weight:600">Ver bingos disponibles</a></p>
</main>
<script src="config.js"></script>
<script src="logos.js"></script>
<script>
const g = JSON.parse((() => { try { return localStorage.getItem('bingo_datos'); } catch(e){ return null; } })() || '{}');
if (g.dni) $('dni').value = g.dni;
if (g.telefono) $('tel4').value = String(g.telefono).replace(/\D/g, '').slice(-4);
apiGet('publico').then(d => {
  $('bingo').innerHTML = (d.bingos || []).map(b => `<option value="${b.id}">${b.nombre}</option>`).join('');
  const pre = new URLSearchParams(location.search).get('bingo'); if (pre) $('bingo').value = pre.toUpperCase();
});
$('go').onclick = async () => {
  $('err').textContent = ''; $('res').innerHTML = ''; $('go').disabled = true; $('go').textContent = 'Buscando…';
  try {
    const r = await api({ action: 'consulta', bingo: $('bingo').value, dni: $('dni').value, tel4: $('tel4').value });
    if (!r.ok) { $('err').textContent = r.error; return; }
    $('res').innerHTML = r.bonos.map(b => `<div class="box">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">${logosHTML($('bingo').value, 52)}</div>
      <h3 style="margin:0">${r.bingo.nombre}</h3>
      <p>Bono N° <b>${b.numero_bono}</b> · ${b.nombre}<br><span class="tag ${b.estado}">${b.etiqueta}</span></p>
      <p>Cuotas pagas: <b>${b.pagadas}/${b.total}</b> · Pagado ${pesos(b.pagado)}${b.saldo ? ' · Resta ' + pesos(b.saldo) : ''}</p>
      ${b.sorteo && b.estado !== 'CANCELADO' ? `<p style="background:#f0fdf4;padding:10px;border-radius:10px">Sorteo mensual del <b>${b.sorteo.fecha}</b> por ${r.bingo.sorteos_fuente} (${r.bingo.premios_mensuales}):<br>
        ${b.sorteo.participa ? '<b style="color:#15803d">Ya estás participando</b>' : '<b style="color:#b91c1c">Pagá tu cuota antes de esa fecha para participar</b>'}</p>` : ''}
      ${b.riesgo ? `<p class="err">Atención: ${r.bingo.aviso_mora}</p>` : ''}
      ${b.falta_definitiva ? `<p style="background:#fef3c7;padding:10px;border-radius:10px"><b>¡Bingo pagado!</b> Ahora falta canjear la boleta provisoria por la <b>definitiva</b>, firmada con tu DNI, antes del sorteo. Escribinos para coordinar.</p>` : ''}
      ${(b.especiales || []).length ? `<div style="background:#fef2f2;padding:10px;border-radius:10px;margin:8px 0"><b>Sorteos especiales</b> por ${r.bingo.especiales_fuente}<br><span class="mut">${r.bingo.premios_especiales}</span>
        ${b.especiales.map(e => `<div style="margin-top:4px">${e.nombre} ${e.sorteo}: ${e.clasifica ? '<b style="color:#15803d">' + (e.cerrado ? 'participaste' : 'ya estás adentro') + '</b>' : e.cerrado ? 'no participaste' : `<b style="color:#b91c1c">te falta${e.faltan > 1 ? 'n' : ''} ${e.faltan} cuota${e.faltan > 1 ? 's' : ''} antes del ${e.corte}</b>`}</div>`).join('')}</div>` : ''}
      ${b.deuda ? `<p class="err">Tenés ${pesos(b.deuda)} vencidos.</p>` : b.prox_venc ? `<p>Próxima cuota: <b>${pesos(b.prox_monto)}</b> · vence <b>${b.prox_venc}</b></p>` : ''}
      <table>${b.grilla.map(x => `<tr class="${x.estado}"><td>Cuota ${x.n}</td><td>${x.vence}</td><td>${pesos(x.monto)}</td>
        <td>${x.estado === 'P' ? 'Pagada' : x.estado === 'V' ? '<b style="color:#b91c1c">Vencida</b>' : 'Pendiente'}</td></tr>`).join('')}</table>
      ${b.estado !== 'CANCELADO' ? `<p class="mut">Pagás por transferencia al alias <b>${r.bingo.alias}</b> y mandás el comprobante.</p>
      <a class="btn wa" target="_blank" href="https://wa.me/${r.vendedor_wa}?text=${encodeURIComponent('Hola! Te mando el comprobante de mi bono N° ' + b.numero_bono + ' del ' + r.bingo.nombre)}">Enviar comprobante por WhatsApp</a>` : ''}
    </div>`).join('') + `<p class="mut" style="text-align:center">Sorteo: ${r.bingo.sorteo} · ${r.bingo.lugar}</p>`;
  } catch(e) { $('err').textContent = 'Sin conexión, probá de nuevo.'; }
  finally { $('go').disabled = false; $('go').textContent = 'Consultar'; }
};
</script>
</body>
</html>
